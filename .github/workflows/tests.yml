name: Run Tests

on:
  push:
    branches: ["main", "master", "dev"]
  pull_request:
    branches: ["main", "master", "dev"]
  workflow_call: {}

# Superseded runs are cancelled, except on tags (those feed a release build).
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the QA gate diffs against the PR base branch

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings.
          flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Tests
        run: pytest tests/

      # Definition of Done (docs/STANDARDS.md section 8): diff coverage,
      # complexity, banned patterns, changelog and commit hygiene for the PR.
      # Windows only: Windows-specific code paths count toward coverage.
      - name: QA gate
        if: github.event_name == 'pull_request' && matrix.os == 'windows-latest' && github.actor != 'dependabot[bot]'
        run: python tools/qa_gate.py --base origin/${{ github.base_ref }}
