name: Build App

on:
  push:
    tags:
      - 'v*'   # Trigger on version tags like v1.2.0
  workflow_dispatch: # Allow manual trigger from Actions tab

# A release must never be cancelled halfway through publishing assets.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    uses: ./.github/workflows/tests.yml

  build:
    name: Build packages
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # <-- prevents canceling all jobs if one fails
      matrix:
        include:
          - os: ubuntu-latest
            TARGET: linux
            EXT: ""
            ASSET_NAME: ZeroBlockBridge-linux
          - os: windows-latest
            TARGET: windows
            EXT: ".exe"
            ASSET_NAME: ZeroBlockBridge
    steps:
      # 1. Checkout code
      - uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Install system dependencies (Linux only)
      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-dev libtk8.6 libxcb-xinerama0 libxcb-cursor0

      # 4. Install Python dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # 5. Sync version metadata from git tag (release builds only)
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          python - <<'EOF'
          import re, os

          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          parts = (tag.split("-")[0].split(".") + ["0", "0", "0"])[:3]
          major, minor, patch = (int(p) for p in parts)
          dotted = f"{major}.{minor}.{patch}"
          tup = f"({major}, {minor}, {patch}, 0)"

          vi_path = "packaging/version_info.txt"
          vi = open(vi_path, encoding="utf-8").read()
          vi = re.sub(r"filevers=\([^)]*\)", f"filevers={tup}", vi)
          vi = re.sub(r"prodvers=\([^)]*\)", f"prodvers={tup}", vi)
          vi = re.sub(r"(StringStruct\('FileVersion', ')[^']*(')", rf"\g<1>{dotted}.0\g<2>", vi)
          vi = re.sub(r"(StringStruct\('ProductVersion', ')[^']*(')", rf"\g<1>{dotted}.0\g<2>", vi)
          open(vi_path, "w", encoding="utf-8").write(vi)

          cfg_path = "app/core/app_config.py"
          cfg = open(cfg_path, encoding="utf-8").read()
          cfg = re.sub(r'APP_VERSION = "[^"]*"', f'APP_VERSION = "{dotted}"', cfg)
          open(cfg_path, "w", encoding="utf-8").write(cfg)
          EOF

      # 6a. Build on Linux
      - name: Build with PyInstaller (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          pyinstaller packaging/linux.spec
          mv dist/zeroblockbridge dist/${{ matrix.ASSET_NAME }}

      # 6b. Build on Windows
      - name: Build with PyInstaller (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller packaging/ZeroBlockBridge.spec

      # 7. Checksum -- generated from inside dist/ so the .sha256 holds a bare
      #    filename and `sha256sum -c` works next to the downloaded binary.
      - name: Generate checksum
        shell: bash
        working-directory: dist
        run: |
          file="${{ matrix.ASSET_NAME }}${{ matrix.EXT }}"
          sha256sum "$file" > "$file.sha256"
          cat "$file.sha256"

      # 8. Upload artifacts
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZeroBlockBridge-${{ matrix.TARGET }}
          path: dist/*

  release:
    name: Publish release
    needs: build   # every matrix leg must succeed -- no half-published releases
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ZeroBlockBridge-*
          merge-multiple: true
          path: dist

      # --strict: a tag with no changelog entry fails the release instead of
      # publishing an empty body.
      - name: Extract release notes from changelog
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: python tools/extract_changelog_section.py "$TAG_NAME" --strict > release_notes.md

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/ZeroBlockBridge.exe
            dist/ZeroBlockBridge.exe.sha256
            dist/ZeroBlockBridge-linux
            dist/ZeroBlockBridge-linux.sha256
