name: Build App

on:
  push:
    tags:
      - 'v*'   # Trigger on version tags like v1.2.0
  workflow_dispatch: # Allow manual trigger from Actions tab

jobs:
  build:
    name: Build packages
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # <-- prevents canceling all jobs if one fails
      matrix:
        include:
          - os: ubuntu-latest
            TARGET: linux
            EXT: ""
          - os: windows-latest
            TARGET: windows
            EXT: ".exe"
    steps:
      # 1. Checkout code
      - uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Install system dependencies (Linux only)
      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-dev libtk8.6 libxcb-xinerama0 libxcb-cursor0

      # 4. Install Python dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # 5. Debug: show folder structure
      - name: Show folder structure
        run: |
          python -c "import os; [print(os.path.join(dp, f)) for dp, dn, fn in os.walk('.') for f in fn if '.git' not in dp]"

      # 6a. Build on Linux
      - name: Build with PyInstaller (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          pyinstaller linux.spec
          mv dist/zeroblockbridge dist/ZeroBlockBridge-linux

      # 6b. Build on Windows
      - name: Build with PyInstaller (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller ZeroBlockBridge.spec
          Move-Item dist/ZeroBlockBridge.exe dist/ZeroBlockBridge-windows.exe

      # 7. Upload artifacts
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZeroBlockBridge-${{ matrix.TARGET }}
          path: dist/*

      # 8. Auto-Release
      - name: Create Release and Upload Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ZeroBlockBridge-${{ matrix.TARGET }}${{ matrix.EXT }}
