version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    groups:
      runtime:
        patterns: ["*"]
        exclude-patterns: ["pytest", "flake8"]
      dev-tools:
        patterns: ["pytest", "flake8"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
