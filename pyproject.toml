[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zeroblockbridge"
version = "1.4.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "customtkinter>=5.2.2",
    "requests>=2.33.1",
    "Pillow>=12.2.0",
    "psutil>=7.2.2",
    "packaging>=26.0",
]

[project.scripts]
zeroblockbridge = "app.launcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
