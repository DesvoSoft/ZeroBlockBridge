[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zeroblockbridge"
version = "2.2.0"
requires-python = ">=3.10"
dependencies = [
    "customtkinter>=5.2.2,<7",
    "requests>=2.33.1,<3",
    "Pillow>=12.2.0,<13",
    "psutil>=7.2.2,<8",
    "packaging>=26.0",
]

[project.scripts]
zeroblockbridge = "app.launcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
